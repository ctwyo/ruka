<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Учёт посещаемости</title>
    <script type="module" crossorigin src="/assets/index-_pMfryZk2.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-MEaYmMv9.css">
    <!-- Светлая тема: переопределяет палитру собранного CSS, грузится строго после него -->
    <link rel="stylesheet" href="/theme-light.css">
  </head>
  <body>
    <div id="root"></div>

    <!-- Приветственный/прощальный оверлей: одна страница /greeting/,
         режим прихода или ухода выбирается параметром ?kind= -->
    <script>
      (function () {
        var OVERLAY_MS = 3000; // сколько держать страницу на экране (мс)

        // Фон оверлея должен совпадать и с фоном /greeting/ (--bg), и с фоном
        // самого дашборда — иначе в момент появления виден кадр чужого цвета.
        var BG = "#E9ECF1";

        // Страницы свёрстаны под макет 1280x1080 — держим iframe в этом
        // логическом размере и масштабируем его по центру под экран.
        var BASE_W = 1280, BASE_H = 1080;

        var FADE_IN_MS = 240, FADE_OUT_MS = 260;

        // Проявляется и гаснет оверлей целиком — фон вместе с контентом.
        // Раньше фон включался мгновенно, и между ним и появлением контента
        // был виден голый цветной кадр: это и читалось как мигание.
        // pointer-events:none — оверлей чисто декоративный и, пока он прозрачен,
        // не должен перехватывать касания по киоску.
        var overlay = document.createElement("div");
        overlay.id = "greeting-overlay";
        overlay.style.cssText =
          "position:fixed;inset:0;z-index:2147483647;display:none;opacity:0;" +
          "pointer-events:none;align-items:center;justify-content:center;" +
          "overflow:hidden;background:" + BG;
        var frame = document.createElement("iframe");
        frame.style.cssText =
          "width:" + BASE_W + "px;height:" + BASE_H + "px;border:0;display:block;" +
          "transform-origin:center center";
        overlay.appendChild(frame);
        document.body.appendChild(overlay);

        function fit() {
          var k = Math.min(window.innerWidth / BASE_W, window.innerHeight / BASE_H);
          frame.style.transform = "scale(" + k + ")";
        }
        window.addEventListener("resize", function () {
          if (overlay.style.display !== "none") fit();
        });

        // /greeting/ сам сообщает о готовности: data-ready появляется, когда
        // разобран шрифт и декодирована картинка. Сверяем ещё и doc.URL —
        // сразу после присвоения src в iframe какое-то время висит ПРЕДЫДУЩИЙ
        // документ, у него data-ready уже стоит, и без этой проверки мы
        // показывали кадр прошлого события до подмены на новый.
        function contentReady(href) {
          try {
            var doc = frame.contentDocument;
            if (!doc || !doc.documentElement) return false;
            if (doc.URL !== href) return false;
            return doc.documentElement.hasAttribute("data-ready");
          } catch (e) {
            return true; // не должно случаться (тот же origin), но не залипаем
          }
        }

        // Команда странице проиграть анимацию — отдаём ровно в момент, когда
        // начинаем проявлять оверлей, чтобы текст выезжал не раньше фона.
        function play() {
          try {
            var el = frame.contentDocument && frame.contentDocument.documentElement;
            if (el) el.setAttribute("data-play", "1");
          } catch (e) {}
        }

        var hideTimer = null;
        var seq = 0;
        function show(url) {
          var mine = ++seq;
          if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }

          // Уникальный параметр на каждый показ: гарантирует настоящую
          // перезагрузку документа (иначе повторный приход того же человека
          // даёт тот же src и анимация не переигрывается) и делает сверку
          // doc.URL однозначной. Картинки и шрифты берутся из кэша — их
          // адреса не меняются.
          var href = new URL(url, location.href);
          href.searchParams.set("_", mine);
          href = href.href;

          overlay.style.transition = "";
          overlay.style.opacity = "0";
          overlay.style.display = "flex";
          fit();
          frame.src = href;

          var start = Date.now();
          (function waitReady() {
            if (mine !== seq) return; // пришло новое событие — этот показ отменён
            if (contentReady(href) || Date.now() - start > 2500) {
              play();
              overlay.style.transition = "opacity " + FADE_IN_MS + "ms ease";
              void overlay.offsetHeight;            // применить стартовое значение до перехода
              overlay.style.opacity = "1";
              hideTimer = setTimeout(hide, OVERLAY_MS);
            } else {
              requestAnimationFrame(waitReady);
            }
          })();
        }
        function hide() {
          var mine = ++seq;
          overlay.style.transition = "opacity " + FADE_OUT_MS + "ms ease";
          overlay.style.opacity = "0";
          setTimeout(function () {
            if (mine !== seq) return; // за время затухания пришёл новый показ
            overlay.style.display = "none";
            frame.src = "about:blank";
          }, FADE_OUT_MS + 20);
        }

        var lastKey = null;
        function handleEvent(le) {
          if (!le || !le.changed || le.blocked) return;
          if (le.kind !== "in" && le.kind !== "out") return;
          var key = (le.day || "") + " " + (le.time || "") + " " + le.kind + " " + (le.name || "");
          if (key === lastKey) return; // событие транслируется каждый кадр ~4 c — показываем один раз
          lastKey = key;
          show("/greeting/?kind=" + le.kind + "&name=" + encodeURIComponent(le.name || ""));
        }

        // Прогреваем кэш при старте: шрифты и картинки скачиваются один раз,
        // и первое же событие отрисовывается без задержки на загрузку.
        ["nunito-cyrillic.woff2", "nunito-latin.woff2", "highfive.png", "heart.png"]
          .forEach(function (f) { fetch("/greeting/" + f).catch(function () {}); });

        function connect() {
          var proto = location.protocol === "https:" ? "wss:" : "ws:";
          var ws = new WebSocket(proto + "//" + location.host + "/ws");
          ws.onmessage = function (ev) {
            try {
              var msg = JSON.parse(ev.data);
              handleEvent(msg.last_event);
            } catch (e) {}
          };
          ws.onclose = function () {
            setTimeout(connect, 1500); // переподключение при разрыве
          };
        }
        connect();
      })();
    </script>
  </body>
</html>
